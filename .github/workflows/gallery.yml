name: Publish Gallery

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  id-token: write
  pages: write
  actions: write

jobs:
  deploy:
    name: Publish Gallery to Github Pages
    if: ${{ github.repository != 'gautamkrishnar/github-pages-gallery' && github.event.head_commit.message != '' && github.event.head_commit.message != 'Initial commit' }}
    
    runs-on: ubuntu-latest

    # ✅ REQUIRED for deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore build cache 💾
        uses: actions/cache@v4
        with:
          path: build_output
          key: gallery-build-${{ hashFiles('gallery/**') }}
          restore-keys: |
            gallery-build-

      - name: Build Gallery 🔧
        run: |
          docker run -v "$(pwd):/work" ghcr.io/thumbsup/thumbsup \
          /bin/sh -c "cd /work/ && thumbsup --config config.json || true"

      # Optional but recommended: verify output exists
      - name: Verify build output 📁
        run: |
          ls -lah build_output || (echo "build_output missing!" && exit 1)

      - name: Package and upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_output
          name: gh-pages

      - name: Deploy to Github Pages 🚀
        id: deployment   # ✅ REQUIRED for environment.url
        uses: actions/deploy-pages@v4
        with:
          artifact_name: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete artifact 🗑️
        uses: geekyeggo/delete-artifact@v4
        with:
          name: gh-pages
